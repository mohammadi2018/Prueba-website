<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparte tu ubicación</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      min-height: 100vh; display:flex; align-items:center; justify-content:center;
      padding:20px; color:#0f172a;
    }
    .tarjeta {
      background:#fff; width:100%; max-width:420px; border-radius:24px;
      padding:36px 28px; box-shadow:0 20px 40px rgba(14,165,233,.15); text-align:center;
    }
    .icono { font-size:3.5rem; margin-bottom:12px; animation:flotar 3s ease-in-out infinite; }
    @keyframes flotar { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
    h1 { font-size:1.5rem; color:#0c4a6e; margin-bottom:8px; }
    .subtitulo { font-size:.95rem; color:#64748b; margin-bottom:28px; }
    #boton {
      width:100%; padding:16px; border:none; border-radius:14px;
      background:#0ea5e9; color:#fff; font-size:1rem; font-weight:600;
      cursor:pointer; transition:background .2s; font-family:inherit;
    }
    #boton:hover { background:#0284c7; }
    #boton:disabled { background:#7dd3fc; cursor:wait; }
    #mensaje { margin-top:16px; padding:12px 14px; border-radius:12px; font-size:.9rem; display:none; }
    #mensaje.ok { display:block; background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    #mensaje.error { display:block; background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    #mensaje.info { display:block; background:#f0f9ff; color:#075985; border:1px solid #bae6fd; }
    .nota { margin-top:20px; font-size:.8rem; color:#94a3b8; }
  </style>
</head>
<body>
  <main class="tarjeta">
    <div class="icono">📍</div>
    <h1>Comparte tu ubicación</h1>
    <p class="subtitulo">Pulsa el botón para enviar tu ubicación actual.</p>

    <button id="boton" type="button">Compartir mi ubicación</button>
    <div id="mensaje"></div>

    <p class="nota">Tu ubicación se envía de forma segura. No se muestra en pantalla.</p>
  </main>

  <script>
    // ⬇️⬇️⬇️ CAMBIA ESTA URL POR LA TUYA DE FIREBASE ⬇️⬇️⬇️
    var FIREBASE_URL = "https://ubicacines-default-rtdb.europe-west1.firebasedatabase.app/
:
null";

    var boton = document.getElementById("boton");
    var mensaje = document.getElementById("mensaje");

    function mostrar(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = tipo;
    }

    boton.onclick = function () {
      if (!navigator.geolocation) {
        mostrar("Tu navegador no admite la geolocalización.", "error");
        return;
      }

      boton.disabled = true;
      boton.textContent = "Obteniendo ubicación...";
      mostrar("Esperando tu autorización...", "info");

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          var datos = {
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            precision: pos.coords.accuracy,
            fecha: new Date().toISOString()
          };

          // Enviar a Firebase
          fetch(FIREBASE_URL + "ubicaciones.json", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos)
          })
          .then(function (r) { return r.json(); })
          .then(function () {
            mostrar("✅ Ubicación enviada correctamente.", "ok");
            boton.textContent = "🔄 Enviar de nuevo";
            boton.disabled = false;
          })
          .catch(function () {
            mostrar("Hubo un problema al enviar. Inténtalo de nuevo.", "error");
            boton.textContent = "Intentar de nuevo";
            boton.disabled = false;
          });
        },
        function (err) {
          var texto = "No se pudo obtener la ubicación.";
          if (err.code === 1) texto = "Permiso denegado. Activa la ubicación en tu navegador.";
          if (err.code === 2) texto = "Ubicación no disponible.";
          if (err.code === 3) texto = "Se agotó el tiempo. Inténtalo otra vez.";
          mostrar(texto, "error");
          boton.textContent = "📍 Intentar de nuevo";
          boton.disabled = false;
        },
        { enableHighAccuracy: false, timeout: 30000, maximumAge: 0 }
      );
    };
  </script>
</body>
</html>
